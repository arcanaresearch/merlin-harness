[project]
name = "merlin-harness"
version = "0.2.10"
description = "A lean, TUI-first harness for AI security assessments"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.12,<1",
]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["apps", "packages"]
markers = ["postgres: requires MERLIN_TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
