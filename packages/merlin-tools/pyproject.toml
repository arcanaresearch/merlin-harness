[project]
name = "merlin-tools"
version = "0.2.28"
description = "Tool broker and safe workspace tools for Merlin"
requires-python = ">=3.13"
dependencies = ["jsonschema>=4.26.0", "merlin-contracts", "merlin-permissions", "merlin-browser"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
merlin-contracts = { workspace = true }
merlin-permissions = { workspace = true }
merlin-browser = { workspace = true }
