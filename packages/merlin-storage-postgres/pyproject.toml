[project]
name = "merlin-storage-postgres"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
  "pg0-embedded==0.15.1",
  "psycopg[binary]>=3.2,<4",
  "merlin-contracts>=0.2.0",
  "merlin-permissions",
  "merlin-memory",
  "merlin-browser",
  "merlin-findings",
  "merlin-agents",
]

[tool.uv.sources]
merlin-contracts = { workspace = true }
merlin-permissions = { workspace = true }
merlin-memory = { workspace = true }
merlin-browser = { workspace = true }
merlin-findings = { workspace = true }
merlin-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merlin_storage_postgres"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
addopts = "-q"
markers = ["postgres: requires MERLIN_TEST_DATABASE_URL"]
