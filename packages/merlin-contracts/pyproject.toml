[project]
name = "merlin-contracts"
version = "0.2.29"
description = "Shared public contracts for Merlin"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
