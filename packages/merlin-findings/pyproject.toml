[project]
name = "merlin-findings"
version = "0.2.13"
description = "Finding lifecycle and report exports for Merlin"
requires-python = ">=3.13"
dependencies = ["merlin-contracts"]

[tool.uv.sources]
merlin-contracts = { workspace = true }
merlin-storage-postgres = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merlin_findings"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "merlin-storage-postgres",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
