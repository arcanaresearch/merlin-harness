[project]
name = "merlin-skills"
version = "0.2.19"
description = "Safe SKILL.md discovery and context loading for Merlin"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merlin_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
