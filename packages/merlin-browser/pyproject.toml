[project]
name = "merlin-browser"
version = "0.2.15"
description = "Bounded Playwright browser automation for Merlin"
requires-python = ">=3.13"
dependencies = ["playwright>=1.55,<2", "pydantic>=2.10,<3", "merlin-contracts"]

[tool.uv.sources]
merlin-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merlin_browser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
