[project]
name = "merlin-agents"
version = "0.2.7"
description = "Bounded lead and worker agent orchestration for Merlin"
requires-python = ">=3.13"
dependencies = [
  "jsonschema>=4.26.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44",
  "opentelemetry-sdk>=1.44",
  "merlin-contracts",
]

[tool.uv.sources]
merlin-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merlin_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
