[project]
name = "merlin-memory"
version = "0.2.26"
description = "Reviewed portable memory bundles for Merlin"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.10,<3", "merlin-agents"]

[tool.uv.sources]
merlin-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merlin_memory"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
