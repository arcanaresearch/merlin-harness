[project]
name = "merlin-promotion"
version = "0.2.8"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<1",
  "merlin-agents>=0.2.0",
  "merlin-browser>=0.2.0",
  "merlin-contracts>=0.2.0",
]

[tool.uv.sources]
merlin-agents = { workspace = true }
merlin-contracts = { workspace = true }
merlin-browser = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merlin_promotion"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]
