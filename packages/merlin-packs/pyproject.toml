[project]
name = "merlin-packs"
version = "0.2.3"
description = "Declarative attack-pack discovery and loading for Merlin"
requires-python = ">=3.13"
dependencies = ["cryptography>=46", "merlin-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merlin_packs"]
artifacts = ["src/merlin_packs/catalog/*.json*", "src/merlin_packs/knowledge/*.rpk.enc"]
exclude = ["src/merlin_packs/knowledge/*.rpk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
merlin-contracts = { workspace = true }
