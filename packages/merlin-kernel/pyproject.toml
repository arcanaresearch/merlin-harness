[project]
name = "merlin-kernel"
version = "0.2.31"
description = "Session orchestration and command routing for Merlin"
requires-python = ">=3.13"
dependencies = ["merlin-contracts"]

[tool.uv.sources]
merlin-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merlin_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
