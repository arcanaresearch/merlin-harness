[project]
name = "merlin-mcp"
version = "0.2.8"
description = "Managed local and authenticated remote MCP clients for Merlin"
requires-python = ">=3.13"
dependencies = ["httpx2>=2,<3", "mcp>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merlin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
